apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
spec:
  capacity:
    storage: {{ .Values.mongodb.storage | quote }}
  accessModes:
    - ReadWriteOnce
  storageClassName: "manual"
  hostPath:
    path: {{ .Values.mongodb.hostPath | quote }}
  persistentVolumeReclaimPolicy: Retain
