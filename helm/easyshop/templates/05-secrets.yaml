{{- if ne .Values.secrets.create false }}
apiVersion: v1
kind: Secret
metadata:
  name: easyshop-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "Set secrets.jwtSecret" .Values.secrets.jwtSecret | quote }}
  NEXTAUTH_SECRET: {{ required "Set secrets.nextauthSecret" .Values.secrets.nextauthSecret | quote }}
{{- end }}
