{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: {{ .Values.migration.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: easyshop-config
                  key: MONGODB_URI
{{- end }}